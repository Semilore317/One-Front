name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  formatting:
    name: Check C++ formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key |
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null

          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" |
            sudo tee /etc/apt/sources.list.d/llvm.list

          sudo apt-get update
          sudo apt-get install -y clang-format-22

      - name: Check formatting
        run: |
          git ls-files -z \
            '*.cpp' \
            '*.hpp' \
            '*.h' \
            '*.cc' \
            '*.cxx' |
          xargs -0 -r clang-format-22 \
            --dry-run \
            --Werror \
            --style=file \
            --fallback-style=none

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@v4.2.3

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target OneFront

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@v4.2.3

      - name: Install raylib dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxcursor-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target OneFront
        